<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Joystick</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #2c2c2c;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .joystick-area {
            position: relative;
            width: 250px;
            height: 250px;
            background-color: #222;
            border: 2px solid #444;
            border-radius: 15px;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-puck {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #4CAF50;
            border-radius: 50%;
            border: 3px solid #81C784;
            transition: transform 0.1s linear; /* Animação suave */
            /* A posição inicial será definida pelo JavaScript */
        }
        
        .coordinates {
            font-size: 1.2em;
            margin-top: 20px;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Controle do Joystick</h1>
        
        <div class="joystick-area">
            <div id="joystick-puck"></div>
        </div>
        
        <div class="coordinates">
            <span>X: <strong id="valor-x">--</strong></span> | 
            <span>Y: <strong id="valor-y">--</strong></span>
        </div>

        <div class="footer">
            Última atualização: <span id="valor-atualizacao">Nunca</span>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const CLOUD_FUNCTION_URL = "https://get-joystick-data-596248462529.southamerica-east1.run.app";

        // --- LÓGICA DE ATUALIZAÇÃO ---

        const elJoystickPuck = document.getElementById("joystick-puck");
        const elValorX = document.getElementById("valor-x");
        const elValorY = document.getElementById("valor-y");
        const elAtualizacao = document.getElementById("valor-atualizacao");

        async function buscarDadosJoystick() {
            try {
                const response = await fetch(CLOUD_FUNCTION_URL);
                if (!response.ok) throw new Error(`Erro na requisição: ${response.status}`);
                
                const dados = await response.json();

                const x = parseInt(dados.x, 10);
                const y = parseInt(dados.y, 10);

                // Atualiza os valores de texto na tela
                elValorX.textContent = x;
                elValorY.textContent = y;

                // Move o elemento visual do joystick
                // O valor de X e Y vai de -100 a 100. Nós o convertemos para uma porcentagem.
                // O centro do puck é 50%, então subtraímos isso para centralizar.
                const puckX = (x / 100) * 50; // Mapeia -100/100 para -50%/+50%
                const puckY = (y / 100) * -50; // O eixo Y do CSS é invertido
                
                elJoystickPuck.style.transform = `translate(${puckX}%, ${puckY}%)`;

                // Atualiza o timestamp
                const dataFormatada = new Date(dados.ultima_atualizacao).toLocaleTimeString('pt-BR');
                elAtualizacao.textContent = dataFormatada;

            } catch (error) {
                console.error("Falha ao buscar dados:", error);
                elValorX.textContent = "Erro";
                elValorY.textContent = "Erro";
            }
        }

        // --- INICIALIZAÇÃO ---
        document.addEventListener("DOMContentLoaded", buscarDadosJoystick);
        setInterval(buscarDadosJoystick, 500); // Atualiza a cada meio segundo para mais fluidez

    </script>

</body>
</html>
