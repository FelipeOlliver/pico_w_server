<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Rosa dos Ventos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background-color: #2c2c2c;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 450px;
        }

        h1 {
            color: #00bcd4; /* Ciano */
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .compass-container {
            margin-top: 20px;
        }

        .direction-text {
            font-size: 2em;
            font-weight: bold;
            color: #ffeb3b; /* Amarelo */
            height: 50px;
            line-height: 50px;
            margin-bottom: 20px;
        }

        .compass-svg .arrow {
            transition: transform 0.3s ease-in-out; /* Animação de rotação suave */
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rosa dos Ventos - Pico W</h1>
        
        <div id="direction-display" class="direction-text">Repouso</div>

        <div class="compass-container">
            <svg width="300" height="300" viewBox="0 0 200 200" class="compass-svg">
                <!-- Fundo e marcações estáticas -->
                <circle cx="100" cy="100" r="98" fill="#222" stroke="#444" stroke-width="2" />
                <line x1="100" y1="5" x2="100" y2="195" stroke="#555" stroke-width="1"/>
                <line x1="5" y1="100" x2="195" y2="100" stroke="#555" stroke-width="1"/>
                <line x1="30" y1="30" x2="170" y2="170" stroke="#444" stroke-width="1"/>
                <line x1="30" y1="170" x2="170" y2="30" stroke="#444" stroke-width="1"/>
                
                <!-- Pontos cardeais -->
                <text x="95" y="22" font-size="12" fill="#00bcd4">N</text>
                <text x="95" y="188" font-size="12" fill="#00bcd4">S</text>
                <text x="180" y="104" font-size="12" fill="#00bcd4">L</text>
                <text x="10" y="104" font-size="12" fill="#00bcd4">O</text>
                
                <!-- Seta vermelha dinâmica -->
                <g id="arrow-group" class="arrow">
                    <polygon points="100,20 115,50 85,50" fill="#f44336" />
                </g>
            </svg>
        </div>

        <div class="footer">
            Última atualização: <span id="valor-atualizacao">Nunca</span>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const CLOUD_FUNCTION_URL = "https://get-compass-data-596248462529.southamerica-east1.run.app";

        // --- LÓGICA DE ATUALIZAÇÃO ---

        const elDirectionText = document.getElementById("direction-display");
        const elArrowGroup = document.getElementById("arrow-group");
        const elAtualizacao = document.getElementById("valor-atualizacao");

        async function buscarDadosCompass() {
            try {
                const response = await fetch(CLOUD_FUNCTION_URL);
                if (!response.ok) throw new Error(`Erro na requisição: ${response.status}`);
                
                const dados = await response.json();

                const direction = dados.direction;
                const angle = parseInt(dados.angle, 10);

                // Atualiza o texto da direção
                elDirectionText.textContent = direction;

                // Rotaciona a seta do SVG
                elArrowGroup.style.transformOrigin = '100px 100px'; // Define o centro da rotação
                elArrowGroup.style.transform = `rotate(${angle}deg)`;

                // Oculta a seta se estiver em repouso
                if (direction === "Repouso") {
                    elArrowGroup.style.visibility = 'hidden';
                } else {
                    elArrowGroup.style.visibility = 'visible';
                }

                // Atualiza o timestamp
                const dataFormatada = new Date(dados.ultima_atualizacao).toLocaleTimeString('pt-BR');
                elAtualizacao.textContent = dataFormatada;

            } catch (error) {
                console.error("Falha ao buscar dados:", error);
                elDirectionText.textContent = "Erro";
            }
        }

        // --- INICIALIZAÇÃO ---
        document.addEventListener("DOMContentLoaded", buscarDadosCompass);
        setInterval(buscarDadosCompass, 500); // Atualiza a cada meio segundo

    </script>

</body>
</html>
